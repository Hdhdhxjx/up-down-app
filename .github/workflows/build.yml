name: Build Android APK

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android SDK Platform 35
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.txt; exit ${PIPESTATUS[0]}

    - name: Print build error
      if: failure()
      run: |
        echo "::group::Build Output (last 80 lines)"
        tail -80 build_output.txt || echo "No build_output.txt found"
        echo "::endgroup::"
        tail -80 build_output.txt | grep -E "error:|Error:|FAILURE:|e: |> " | head -30 | while IFS= read -r line; do
          echo "::error::$line"
        done

    - name: Upload build log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.txt

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: up-down-app-apk
        path: app/build/outputs/apk/debug/app-debug.apk
